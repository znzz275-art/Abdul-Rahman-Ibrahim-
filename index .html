<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="موقع تحميل التطبيقات والألعاب">
<title>Zizio Apps - تحميل التطبيقات والألعاب</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

:root{
    --bg:#0b0f19;
    --card:#151b29;
    --card2:#1b2333;
    --text:#fff;
    --muted:#9da7ba;
    --primary:#6c5ce7;
    --primary2:#8e7dff;
    --border:rgba(255,255,255,.08);
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* Header */
header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(11,15,25,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:white;
}

.logo span{
    color:var(--primary2);
}

nav{
    display:flex;
    gap:8px;
}

nav button{
    border:0;
    background:transparent;
    color:#ddd;
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}

nav button:hover,
nav button.active{
    background:var(--primary);
    color:white;
}

/* Hero */
.hero{
    max-width:1200px;
    margin:35px auto 20px;
    padding:20px;
}

.heroBox{
    background:
      radial-gradient(circle at 20% 20%,rgba(108,92,231,.35),transparent 35%),
      linear-gradient(135deg,#171d31,#101521);
    border:1px solid var(--border);
    border-radius:25px;
    padding:45px 25px;
    text-align:center;
}

.hero h1{
    font-size:38px;
    margin-bottom:12px;
}

.hero h1 span{
    color:var(--primary2);
}

.hero p{
    color:var(--muted);
    margin-bottom:25px;
}

/* Search */
.search{
    max-width:650px;
    margin:auto;
    position:relative;
}

.search input{
    width:100%;
    padding:17px 50px 17px 18px;
    border:1px solid var(--border);
    border-radius:15px;
    outline:none;
    background:#0d121d;
    color:white;
    font-size:15px;
}

.searchIcon{
    position:absolute;
    right:17px;
    top:50%;
    transform:translateY(-50%);
    font-size:20px;
}

/* Content */
.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.sectionTitle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:15px 0 20px;
}

.sectionTitle h2{
    font-size:23px;
}

.count{
    color:var(--muted);
    font-size:14px;
}

/* Cards */
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px;
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    background:var(--card2);
    border-color:rgba(142,125,255,.35);
}

.appImage{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:14px;
    display:block;
}

.card h3{
    margin:13px 0 7px;
    font-size:17px;
}

.card p{
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
    min-height:43px;
}

.info{
    display:flex;
    justify-content:space-between;
    color:#8993a8;
    font-size:11px;
    margin:12px 0;
}

.download{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:var(--primary);
    color:white;
    padding:12px;
    border-radius:11px;
    font-weight:bold;
    transition:.2s;
}

.download:hover{
    background:var(--primary2);
}

/* Empty */
.empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    display:none;
}

.emptyIcon{
    font-size:45px;
    margin-bottom:10px;
}

/* Footer */
footer{
    margin-top:60px;
    border-top:1px solid var(--border);
    padding:30px 20px;
    text-align:center;
    color:var(--muted);
}

footer strong{
    color:white;
}

/* Mobile */
@media(max-width:900px){
    .grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){
    .nav{
        flex-direction:column;
    }

    nav{
        width:100%;
        justify-content:center;
        flex-wrap:wrap;
    }

    .hero h1{
        font-size:28px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .card{
        padding:10px;
    }

    .card h3{
        font-size:15px;
    }
}

@media(max-width:380px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="nav">

        <div class="logo">
            Zizio <span>Apps</span>
        </div>

        <nav>
            <button class="active" onclick="filterApps('all',this)">الكل</button>
            <button onclick="filterApps('games',this)">🎮 الألعاب</button>
            <button onclick="filterApps('apps',this)">📱 التطبيقات</button>
        </nav>

    </div>
</header>

<section class="hero">

    <div class="heroBox">

        <h1>
            حمّل <span>التطبيقات والألعاب</span>
            بسهولة
        </h1>

        <p>
            أحدث التطبيقات والألعاب في مكان واحد
        </p>

        <div class="search">
            <span class="searchIcon">🔍</span>
            <input
                type="search"
                id="search"
                placeholder="ابحث عن لعبة أو تطبيق..."
                oninput="searchApps()"
            >
        </div>

    </div>

</section>

<main class="container">

    <div class="sectionTitle">
        <h2>🔥 أحدث الإضافات</h2>
        <span class="count" id="count"></span>
    </div>

    <div class="grid" id="appGrid"></div>

    <div class="empty" id="empty">
        <div class="emptyIcon">🔎</div>
        <h3>لم يتم العثور على نتائج</h3>
        <p>جرّب البحث باسم مختلف</p>
    </div>

</main>

<footer>
    <strong>Zizio Apps</strong>
    <br><br>
    موقع لتحميل التطبيقات والألعاب
    <br><br>
    © 2026 جميع الحقوق محفوظة
</footer>

<script>

/* ==========================================
   أضف التطبيقات والألعاب من هنا
   ========================================== */

const items = [

    {
        name:"لعبة سباق السيارات",
        type:"games",
        image:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800",
        description:"لعبة سباق سيارات ممتعة ومناسبة للموبايل.",
        size:"850 MB",
        version:"1.0.0",
        download:"https://example.com/game.apk"
    },

    {
        name:"لعبة المغامرات",
        type:"games",
        image:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800",
        description:"ابدأ مغامرة جديدة واستكشف عالم اللعبة.",
        size:"620 MB",
        version:"2.1.0",
        download:"https://example.com/adventure.apk"
    },

    {
        name:"تطبيق مشاهدة الفيديو",
        type:"apps",
        image:"https://images.unsplash.com/photo-1536240478700-b869070f9279?w=800",
        description:"تطبيق لمشاهدة الفيديوهات بسهولة.",
        size:"75 MB",
        version:"4.2.1",
        download:"https://example.com/video.apk"
    },

    {
        name:"تطبيق الصور",
        type:"apps",
        image:"https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=800",
        description:"تطبيق بسيط لإدارة الصور والفيديوهات.",
        size:"45 MB",
        version:"3.0.2",
        download:"https://example.com/photos.apk"
    },

    {
        name:"لعبة كرة القدم",
        type:"games",
        image:"https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=800",
        description:"لعبة كرة قدم ممتعة للموبايل.",
        size:"1.2 GB",
        version:"5.0.0",
        download:"https://example.com/football.apk"
    },

    {
        name:"متصفح الإنترنت",
        type:"apps",
        image:"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=800",
        description:"متصفح سريع وسهل الاستخدام.",
        size:"90 MB",
        version:"8.1.0",
        download:"https://example.com/browser.apk"
    },

    {
        name:"لعبة الألغاز",
        type:"games",
        image:"https://images.unsplash.com/photo-1606167668584-78701c57f13d?w=800",
        description:"اختبر ذكاءك مع مجموعة من الألغاز.",
        size:"180 MB",
        version:"1.5.0",
        download:"https://example.com/puzzle.apk"
    },

    {
        name:"مشغل الموسيقى",
        type:"apps",
        image:"https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=800",
        description:"مشغل موسيقى بتصميم بسيط وسريع.",
        size:"35 MB",
        version:"6.0.1",
        download:"https://example.com/music.apk"
    }

];


/* ==========================================
   عرض التطبيقات
   ========================================== */

let currentFilter = "all";

function renderApps(){

    const grid = document.getElementById("appGrid");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");

    const searchValue =
        document.getElementById("search").value
        .toLowerCase()
        .trim();

    let filtered = items.filter(item => {

        const typeMatch =
            currentFilter === "all" ||
            item.type === currentFilter;

        const searchMatch =
            item.name.toLowerCase().includes(searchValue) ||
            item.description.toLowerCase().includes(searchValue);

        return typeMatch && searchMatch;
    });

    grid.innerHTML = "";

    count.textContent = filtered.length + " عنصر";

    if(filtered.length === 0){
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    filtered.forEach(item => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <img
                class="appImage"
                src="${item.image}"
                alt="${item.name}"
                loading="lazy"
            >

            <h3>${item.name}</h3>

            <p>${item.description}</p>

            <div class="info">
                <span>📦 ${item.size}</span>
                <span>v${item.version}</span>
            </div>

            <a
                class="download"
                href="${item.download}"
                target="_blank"
                rel="noopener"
            >
                ⬇️ تحميل
            </a>

        `;

        grid.appendChild(card);

    });
}


/* ==========================================
   التصنيفات
   ========================================== */

function filterApps(type, button){

    currentFilter = type;

    document
        .querySelectorAll("nav button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderApps();
}


/* ==========================================
   البحث
   ========================================== */

function searchApps(){
    renderApps();
}


/* تشغيل الموقع */

renderApps();

</script>

</body>
</html>
