<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>عبد الرحمن إبراهيم | حساباتي</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      color: white;

      /* الصورة التي رفعتها كخلفية */
      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.35),
          rgba(0, 0, 0, 0.72)
        ),
        url("1000141850.jpg");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 15px;
    }

    /* طبقة زجاجية للموقع */
    .container {
      width: 100%;
      max-width: 500px;

      text-align: center;

      padding: 35px 22px;

      border-radius: 30px;

      background: rgba(0, 0, 0, 0.28);

      border: 1px solid rgba(255,255,255,0.18);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.45);

      animation: appear 0.8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* الصورة الشخصية الصغيرة */
    .profile-photo {
      width: 125px;
      height: 125px;

      object-fit: cover;

      border-radius: 50%;

      border: 4px solid white;

      box-shadow:
        0 0 25px rgba(255,255,255,0.35);

      margin-bottom: 15px;
    }

    .name {
      font-size: 30px;
      font-weight: 800;

      text-shadow:
        0 3px 12px rgba(0,0,0,0.8);

      margin-bottom: 8px;
    }

    .verified {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 22px;
      height: 22px;

      border-radius: 50%;

      background: #1877f2;

      font-size: 14px;

      vertical-align: middle;
    }

    .bio {
      font-size: 16px;
      line-height: 1.8;

      color: #eee;

      margin-bottom: 25px;

      text-shadow:
        0 2px 8px black;
    }

    .title {
      font-size: 14px;
      color: #ddd;

      margin-bottom: 14px;
    }

    /* أزرار الروابط */
    .links {
      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .social-btn {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 64px;

      border-radius: 18px;

      text-decoration: none;

      color: white;

      font-size: 17px;
      font-weight: bold;

      background: rgba(255,255,255,0.12);

      border: 1px solid rgba(255,255,255,0.25);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 8px 25px rgba(0,0,0,0.25);

      transition: 0.25s ease;
    }

    .social-btn:hover {
      transform: translateY(-4px);

      background: rgba(255,255,255,0.22);

      box-shadow:
        0 12px 35px rgba(0,0,0,0.4);
    }

    .social-btn:active {
      transform: scale(0.97);
    }

    .icon {
      position: absolute;

      right: 20px;

      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 23px;
      font-weight: bold;
    }

    .arrow {
      position: absolute;

      left: 20px;

      font-size: 25px;

      color: rgba(255,255,255,0.7);
    }

    /* واتساب */
    .whatsapp .icon {
      color: #25D366;
    }

    /* فيسبوك */
    .facebook .icon {
      color: #1877F2;
    }

    /* إنستجرام */
    .instagram .icon {
      color: #E1306C;
    }

    /* زر المشاركة */
    .share {
      margin-top: 20px;

      padding: 12px 25px;

      border-radius: 50px;

      border: 1px solid rgba(255,255,255,0.2);

      background: rgba(255,255,255,0.12);

      color: white;

      font-size: 14px;

      cursor: pointer;

      transition: 0.2s;
    }

    .share:hover {
      background: rgba(255,255,255,0.22);
    }

    .footer {
      margin-top: 25px;

      font-size: 12px;

      color: #bbb;
    }

    /* للموبايل */
    @media (max-width: 500px) {

      body {
        padding: 15px;
        background-attachment: scroll;
      }

      .container {
        padding: 30px 16px;

        border-radius: 25px;
      }

      .profile-photo {
        width: 110px;
        height: 110px;
      }

      .name {
        font-size: 25px;
      }

      .social-btn {
        min-height: 60px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- صورة البروفايل -->
    <img
      class="profile-photo"
      src="1000141850.jpg"
      alt="عبد الرحمن إبراهيم"
    >

    <!-- الاسم -->
    <h1 class="name">
      عبد الرحمن إبراهيم
      <span class="verified">✓</span>
    </h1>

    <!-- الوصف -->
    <p class="bio">
      صانع محتوى 🎬😂<br>
      تابعني على حساباتي الرسمية ❤️
    </p>

    <div class="title">
      🔗 حساباتي وروابطي
    </div>

    <div class="links">

      <!-- واتساب -->
      <a
        class="social-btn whatsapp"
        href="https://wa.me/201279082533"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">☏</span>

        <span>
          تواصل معي على واتساب
        </span>

        <span class="arrow">‹</span>
      </a>


      <!-- فيسبوك -->
      <a
        class="social-btn facebook"
        href="https://www.facebook.com/share/1EKSKo6XZr/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">f</span>

        <span>
          صفحتي على فيسبوك
        </span>

        <span class="arrow">‹</span>
      </a>


      <!-- إنستجرام -->
      <a
        class="social-btn instagram"
        href="https://www.instagram.com/abdul_rahman._2007?igsh=MnkxOTVsbmR6anV2"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">◎</span>

        <span>
          حسابي على إنستجرام
        </span>

        <span class="arrow">‹</span>
      </a>

    </div>


    <!-- مشاركة -->
    <button class="share" onclick="sharePage()">
      ↗️ مشاركة صفحتي
    </button>


    <div class="footer">
      © 2026 عبد الرحمن إبراهيم
    </div>

  </div>


  <script>
    function sharePage() {

      if (navigator.share) {

        navigator.share({
          title: "عبد الرحمن إبراهيم",
          text: "كل حساباتي وروابطي هنا 👇",
          url: window.location.href
        });

      } else {

        navigator.clipboard
          .writeText(window.location.href)
          .then(() => {
            alert("تم نسخ رابط الصفحة 📋");
          });

      }
    }
  </script>

</body>
</html>
