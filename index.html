<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة عبد الرحمن</title>
    <style>
        /* إعدادات عامة */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* حاوية الصفحة */
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* تصميم الصورة الدائرية */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #ff0000;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }

        /* تصميم الأزرار */
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background: #1e1e1e;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            transition: transform 0.3s, background 0.3s;
            border: 1px solid #333;
            display: block;
        }

        .link-card:hover {
            transform: scale(1.05);
            background: #252525;
            border-color: #ff0000;
        }

        /* ألوان مخصصة للمنصات */
        .tiktok { border-left: 5px solid #ff0050; }
        .instagram { border-left: 5px solid #e1306c; }
        .facebook { border-left: 5px solid #1877f2; }

    </style>
</head>
<body>

    <div class="container">
        <img src="1000008042.jpg" alt="عبد الرحمن" class="profile-img">
        
        <h1>عبد الرحمن</h1>

        <div class="links">
            <a href="https://www.tiktok.com/@userq1208?_r=1&_t=ZS-93r6Vt1YXRc" target="_blank" class="link-card tiktok">
                TikTok
            </a>

            <a href="https://www.instagram.com/abdul_rahman._2007?igsh=MnkxOTVsbmR6anV2" target="_blank" class="link-card instagram">
                Instagram
            </a>

            <a href="https://www.facebook.com/share/14WRkQrQKKL/" target="_blank" class="link-card facebook">
                Facebook
            </a>
        </div>
    </div>

</body>
</html>
